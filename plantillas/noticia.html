<li class="noticia">
  <article aria-labelledby="{{ancla}}">
    <p class="noticia__meta"><span class="noticia__medio">{{medio}}</span> · <time datetime="{{fecha_iso}}">{{fecha_texto}}</time></p>
    <{{{nivel}}} class="noticia__titular" id="{{ancla}}">{{titular}}</{{{nivel}}}>
    {{{frase}}}
    <a class="noticia__leer" href="{{enlace}}" target="_blank" rel="noopener" aria-describedby="{{ancla}}">Leer en {{medio}}<span class="noticia__flecha" aria-hidden="true">↗</span></a>
  </article>
</li>
