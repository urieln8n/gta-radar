<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada · Vice City Diario</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0816">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .nf{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 0}
  .nf .stars{font-size:28px;letter-spacing:6px;color:var(--gold);margin-bottom:18px}
  .nf h1{font-size:clamp(40px,9vw,88px);margin-bottom:16px;background:linear-gradient(90deg,var(--pink),#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
  .nf p{color:var(--muted);font-size:18px;max-width:520px;margin:0 auto 32px}
  .nf .acciones{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .nf a.btn{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:800;text-decoration:none}
  .nf a.principal{background:var(--pink);color:var(--bg)}
  .nf a.secundario{border:2px solid var(--cyan);color:var(--cyan)}
</style>
</head>
<body>
<div class="bg-glow"></div><div class="bg-grid"></div>
<main class="nf">
  <div class="wrap">
    <div class="stars" aria-hidden="true">★★★★★★</div>
    <h1 class="display">Te has perdido</h1>
    <p>Esta página no existe. Vuelve a la portada para conseguir la guía gratis de errores de novato en GTA 6.</p>
    <div class="acciones">
      <a class="btn principal" href="/">Ir a la portada</a>
      <a class="btn secundario" href="https://www.youtube.com/channel/UCItRxew6OKw7GxSmqUk3JgA" rel="noopener">Ver el canal</a>
    </div>
  </div>
</main>
</body>
</html>
